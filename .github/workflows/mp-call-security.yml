name: Build MP Call Security APK

on:
  push:
    branches: ["mp-call-security"]
    tags: ["mpcall-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        working-directory: mpcallsecurity
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify APK
        run: test -s mpcallsecurity/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MPCallSecurity-1.2.0-debug
          path: mpcallsecurity/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/mpcall-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mpcallsecurity/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
